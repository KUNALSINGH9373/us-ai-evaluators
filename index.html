<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US AI Evaluators</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f6f5f1; --paper:#ffffff; --ink:#1c2430; --ink2:#46505e; --muted:#7a828e; --rule:#e3e1da; --rule2:#cfccc3; --navy:#1f3350; --link:#28507f;
    --c-dev:#b4644a; --c-gov:#3e5f8a; --c-phil:#5c8a5e; --c-corp:#7d6c9f; --c-none:#a3a8af;
    --f-fp:#3e5f8a; --f-np:#5c8a5e; --f-ff:#b08a45; --f-ua:#8d5b77;
    --serif:"Source Serif 4", Georgia, "Times New Roman", serif; --sans:Inter, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13.5px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  .top { border-top:4px solid var(--navy); background:var(--paper); border-bottom:1px solid var(--rule); }
  .top-in { max-width:1560px; margin:0 auto; padding:26px 24px 20px; display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 32px; }
  h1 { font:600 27px/1.2 var(--serif); margin:0; color:var(--navy); letter-spacing:-.005em; }
  .meta { color:var(--muted); font-size:12.5px; margin-top:6px; }
  .meta b { color:var(--ink2); font-weight:500; }
  .dl { margin-left:auto; font-size:12.5px; font-weight:500; color:var(--navy); text-decoration:none; border:1px solid var(--navy); padding:7px 14px; border-radius:3px; }
  .dl:hover { background:var(--navy); color:#fff; }
  main { min-width:0; max-width:1560px; margin:0 auto; padding:20px 24px 40px; }
  .panel { background:var(--paper); border:1px solid var(--rule); border-radius:4px; padding:16px 18px 14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(190px, 100%), 1fr)); gap:12px 16px; }
  .fld { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .fld.wide { grid-column:span 2; }
  .fld label { font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .fld input, .fld select { font:inherit; font-size:13px; height:34px; padding:0 10px; border:1px solid var(--rule2); border-radius:3px; background:#fff; color:var(--ink); width:100%; }
  .fld input:focus, .fld select:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 2px rgba(31,51,80,.12); }
  .fld select.on { border-color:var(--navy); background:#f3f5f9; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px; margin-top:14px; padding-top:12px; border-top:1px solid var(--rule); font-size:12px; color:var(--ink2); }
  .key { display:flex; flex-wrap:wrap; gap:6px 18px; }
  .key span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; display:inline-block; }
  .count { margin-left:auto; color:var(--muted); }
  .count b { color:var(--ink); font-weight:600; }
  #reset { font:inherit; font-size:12px; background:none; border:none; color:var(--link); cursor:pointer; padding:0; }
  .wrap { margin-top:16px; background:var(--paper); border:1px solid var(--rule); border-radius:4px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:1040px; }
  th { position:sticky; top:0; z-index:1; background:var(--paper); text-align:left; padding:12px 14px 10px; font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--navy); border-bottom:2px solid var(--navy); cursor:pointer; user-select:none; white-space:nowrap; }
  th .arr { margin-left:5px; font-size:9px; color:var(--muted); }
  td { padding:14px; vertical-align:top; border-bottom:1px solid var(--rule); }
  tbody tr:hover td { background:#fbfaf7; }
  td.org { width:16%; font:600 14.5px/1.35 var(--serif); color:var(--ink); }
  td.form { width:9%; white-space:nowrap; }
  td.act { width:20%; }
  td.ev { width:21%; }
  td.rel { width:34%; }
  .form-l { display:inline-flex; align-items:center; gap:7px; font-weight:500; color:var(--ink2); }
  .form-l i { width:3px; height:14px; border-radius:1px; display:inline-block; }
  .sub { display:block; color:var(--muted); font-size:11.5px; margin-top:2px; padding-left:10px; }
  .kv { margin:0; display:grid; grid-template-columns:64px 1fr; gap:3px 8px; }
  .kv dt { font-size:10px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); padding-top:2px; }
  .kv dd { margin:0; color:var(--ink2); }
  .ev a { color:var(--link); text-decoration:none; font-weight:500; }
  .ev a:hover { text-decoration:underline; }
  .ev .note { display:block; color:var(--muted); font-size:11.5px; margin-top:4px; }
  .rl { list-style:none; margin:0; padding:0; }
  .rl li { display:flex; gap:9px; padding:3px 0; color:var(--ink2); }
  .rl li + li { border-top:1px dotted var(--rule); padding-top:5px; margin-top:2px; }
  .rl .dot { margin-top:6px; }
  .rl b { font-weight:600; color:var(--ink); }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  @media (max-width:640px) { .top-in, main { padding-left:16px; padding-right:16px; } h1 { font-size:22px; } .grid { grid-template-columns:1fr 1fr; } .fld.wide { grid-column:1 / -1; } .dl { margin-left:0; } .count { margin-left:0; } }
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div>
    <h1>US Organisations Evaluating Frontier AI Systems</h1>
    <div class="meta">Dataset as of <b id="asof"></b> · <b id="total"></b> organisations</div>
  </div>
  <a class="dl" href="us_ai_evaluators.csv" download>Download CSV</a>
</div></div>
<main>
  <section class="panel">
    <div class="grid">
      <div class="fld wide"><label for="q">Search</label><input id="q" type="search" placeholder="Organisation, evidence or relationship"></div>
      <div class="fld"><label for="f-form">Institutional form</label><select id="f-form"><option value="">All</option></select></div>
      <div class="fld"><label for="f-prop">Property</label><select id="f-prop"><option value="">All</option></select></div>
      <div class="fld"><label for="f-method">Method</label><select id="f-method"><option value="">All</option></select></div>
      <div class="fld"><label for="f-domain">Domain</label><select id="f-domain"><option value="">All</option></select></div>
      <div class="fld"><label for="f-author">Evidence published by</label><select id="f-author"><option value="">All</option></select></div>
      <div class="fld"><label for="f-rel">Relationship type</label><select id="f-rel"><option value="">All</option></select></div>
      <div class="fld"><label for="f-dev">Developer relationship</label><select id="f-dev"><option value="">All</option><option>Yes</option><option>No</option></select></div>
      <div class="fld"><label for="f-devname">Developer</label><select id="f-devname"><option value="">All</option></select></div>
    </div>
    <div class="bar">
      <div class="key">
        <span><i class="dot" style="background:var(--c-dev)"></i>Developer</span>
        <span><i class="dot" style="background:var(--c-gov)"></i>Government</span>
        <span><i class="dot" style="background:var(--c-phil)"></i>Philanthropic</span>
        <span><i class="dot" style="background:var(--c-corp)"></i>Corporate and ownership</span>
        <span><i class="dot" style="background:var(--c-none)"></i>None identified</span>
      </div>
      <span class="count" id="count"></span>
      <button id="reset" type="button">Clear filters</button>
    </div>
  </section>
  <div class="wrap">
    <table>
      <thead><tr>
        <th data-k="organisation">Organisation</th>
        <th data-k="form">Form</th>
        <th data-k="activity_assessed">Activity assessed</th>
        <th data-k="evaluation_evidence">Evaluation evidence</th>
        <th data-k="relationships">Funding and relationships</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script src="data.js"></script>
<script>
(function () {
  const D = window.DATA, $ = (id) => document.getElementById(id);
  $("asof").textContent = window.ASOF; $("total").textContent = D.length;
  const FORMC = { "For-profit": "var(--f-fp)", "Non-profit": "var(--f-np)", "FFRDC": "var(--f-ff)", "UARC": "var(--f-ua)" };
  const uniq = (f) => [...new Set(D.flatMap(f))].filter(Boolean).sort((a, b) => a.localeCompare(b));
  const fill = (id, vals) => vals.forEach((v) => { const o = document.createElement("option"); o.value = o.textContent = v; $(id).appendChild(o); });
  fill("f-form", uniq((r) => [r.form]));
  fill("f-prop", uniq((r) => r.properties));
  fill("f-method", uniq((r) => r.methods));
  fill("f-domain", uniq((r) => r.domains));
  fill("f-author", uniq((r) => [r.evidence_author]));
  fill("f-rel", uniq((r) => r.relationship_types));
  const devCount = {}; D.forEach((r) => r.developers.forEach((d) => (devCount[d] = (devCount[d] || 0) + 1)));
  fill("f-devname", Object.keys(devCount).sort((a, b) => devCount[b] - devCount[a] || a.localeCompare(b)));
  const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const splitRel = (t) => String(t || "").split(/;\s*(?=[A-Z][A-Za-z\- ]+:|\d[\d,]* funders|No relationship)/);
  const relC = (it) => {
    if (/^No relationship/.test(it)) return "var(--c-none)";
    if (/^(Funding from developer|Paid engagement by developer|Developer equity stake|Model access|In-kind support from developer|Research collaboration with developer|Equity stake in developer|Own model development)/.test(it)) return "var(--c-dev)";
    if (/^(Federal funding|Foreign government funding|Government evaluation agreement)/.test(it)) return "var(--c-gov)";
    if (/^(\d[\d,]* funders|Philanthropic|Fiscal sponsor)/.test(it)) return "var(--c-phil)";
    return "var(--c-corp)";
  };
  const relItem = (it) => {
    const m = it.match(/^([A-Z][A-Za-z\- ]+):\s*([\s\S]*)$/);
    const body = m ? `<b>${esc(m[1])}.</b> ${esc(m[2])}` : esc(it);
    return `<li><i class="dot" style="background:${relC(it)}"></i><span>${body}</span></li>`;
  };
  const activity = (t) => {
    const parts = String(t || "").split(/(Property|Method|Domain):\s*/); let html = "";
    for (let i = 1; i < parts.length - 1; i += 2) {
      const vals = parts[i + 1].split(/;\s*(?![^()]*\))/).map((v) => v.trim().replace(/[;.]$/, "")).filter(Boolean);
      html += `<dt>${parts[i]}</dt><dd>${esc(vals.join("; "))}</dd>`;
    }
    return html ? `<dl class="kv">${html}</dl>` : esc(t);
  };
  const evidence = (r) => {
    const [title, ...rest] = String(r.evaluation_evidence || "").split(" — ");
    const t = r.evidence_url ? `<a href="${esc(r.evidence_url)}" target="_blank" rel="noopener">${esc(title)}</a>` : esc(title);
    return t + (rest.length ? `<span class="note">${esc(rest.join(" — "))}</span>` : "");
  };
  const formCell = (r) => {
    const rest = r.institutional_form.slice(r.form.length).trim().replace(/^\(|\)$/g, "");
    return `<span class="form-l"><i style="background:${FORMC[r.form] || "var(--muted)"}"></i>${esc(r.form)}</span>${rest ? `<span class="sub">${esc(rest)}</span>` : ""}`;
  };
  const IDS = ["q", "f-form", "f-prop", "f-method", "f-domain", "f-author", "f-rel", "f-dev", "f-devname"];
  let sortK = "organisation", sortDir = 1;
  function render() {
    const v = (id) => $(id).value, q = v("q").trim().toLowerCase();
    const rows = D.filter((r) =>
      (!v("f-form") || r.form === v("f-form")) && (!v("f-prop") || r.properties.includes(v("f-prop"))) &&
      (!v("f-method") || r.methods.includes(v("f-method"))) && (!v("f-domain") || r.domains.includes(v("f-domain"))) &&
      (!v("f-author") || r.evidence_author === v("f-author")) && (!v("f-rel") || r.relationship_types.includes(v("f-rel"))) &&
      (!v("f-dev") || r.developer_relationship === v("f-dev")) && (!v("f-devname") || r.developers.includes(v("f-devname"))) &&
      (!q || [r.organisation, r.institutional_form, r.activity_assessed, r.evaluation_evidence, r.relationships].join(" ").toLowerCase().includes(q))
    ).sort((a, b) => sortDir * String(a[sortK] || "").localeCompare(String(b[sortK] || "")));
    $("rows").innerHTML = rows.length ? rows.map((r) => `<tr>
      <td class="org">${esc(r.organisation)}</td>
      <td class="form">${formCell(r)}</td>
      <td class="act">${activity(r.activity_assessed)}</td>
      <td class="ev">${evidence(r)}</td>
      <td class="rel"><ul class="rl">${splitRel(r.relationships).map(relItem).join("")}</ul></td></tr>`).join("")
      : `<tr><td colspan="5" class="empty">No organisations match these filters.</td></tr>`;
    $("count").innerHTML = `Showing <b>${rows.length}</b> of ${D.length}`;
    IDS.slice(1).forEach((id) => $(id).classList.toggle("on", !!$(id).value));
    document.querySelectorAll("th[data-k]").forEach((th) => {
      th.querySelector(".arr")?.remove();
      if (th.dataset.k === sortK) th.insertAdjacentHTML("beforeend", `<span class="arr">${sortDir > 0 ? "▲" : "▼"}</span>`);
    });
  }
  IDS.forEach((id) => $(id).addEventListener("input", render));
  $("reset").addEventListener("click", () => { IDS.forEach((id) => ($(id).value = "")); render(); });
  document.querySelectorAll("th[data-k]").forEach((th) => th.addEventListener("click", () => {
    const k = th.dataset.k; sortDir = sortK === k ? -sortDir : 1; sortK = k; render();
  }));
  render();
})();
</script>
</body>
</html>
